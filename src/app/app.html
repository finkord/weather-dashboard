<mat-sidenav-container class="weather-dashboard-container">

  <mat-sidenav #sidenav class="app-sidenav" fixedInViewport [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="main-content-area">
    <app-header [isHandset]="isHandset$ | async" (toggleSidenav)="sidenav.toggle()">
    </app-header>
    <app-main-content></app-main-content>
  </mat-sidenav-content>

</mat-sidenav-container>

<router-outlet></router-outlet>
